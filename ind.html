<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Cricket Avatars</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4978654989713105"
            crossorigin="anonymous"></script>
    <script type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background: #020617;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .glb-item {
            margin-bottom: 60px;
            background: rgba(2,6,23,0.9);
            padding: 20px;
            border-radius: 20px;
        }

        model-viewer {
            width: 100%;
            height: 450px;
            background: #010409;
            border-radius: 16px;
        }

        img {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
        }

        .downloads {
            margin-top: 12px;
            text-align: center;
        }

            .downloads a {
                display: inline-block;
                margin: 6px 10px;
                padding: 10px 22px;
                border-radius: 999px;
                background: #38bdf8;
                color: #020617;
                font-weight: bold;
                text-decoration: none;
            }

        a.back {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>🇮🇳 India Cricket Avatars</h1>
        <a href="index.html" class="back">← Back</a>
    </header>

    <div class="container" id="gallery"></div>

    <script>
        const gallery = document.getElementById("gallery");

        // 1.glb → 11.glb
        for (let i = 1; i <= 11; i++) {
            const glbPath = `assets/models/Ind/${i}.glb`;
            const texPath = `assets/textures/Ind/${i}.jpeg`;

            const div = document.createElement("div");
            div.className = "glb-item";

            div.innerHTML = `
            <h2>Avatar #${i}</h2>

            <model-viewer
                src="${glbPath}"
                camera-controls
                auto-rotate
                shadow-intensity="1">
            </model-viewer>

            <img src="${texPath}" alt="Texture ${i}">

            <div class="downloads">
                <a href="${glbPath}" download>⬇ Download GLB</a>
                <a href="${texPath}" download>⬇ Download Texture</a>
            </div>
        `;

            gallery.appendChild(div);
        }
    </script>

</body>
</html>
