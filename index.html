<!DOCTYPE html>
<html>
<body style="background:#111;color:white;text-align:center;padding:40px">

<h2>Generate 3D Model from Image URL</h2>

<input type="text" id="url" placeholder="Paste image URL here" style="width:300px"><br><br>
<button onclick="generate()">Generate</button>

<p id="status"></p>

<script>
async function generate() {
  const url = document.getElementById("url").value;
  const status = document.getElementById("status");

  if (!url) {
    alert("Paste image URL");
    return;
  }

  status.innerText = "⏳ Generating...";

  try {
    const res = await fetch("https://bitter-mountain-4202.rajibyoutbe541.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ image_url: url })
    });

    const data = await res.json();

    if (!data.success) {
      status.innerText = "❌ Error: " + JSON.stringify(data);
      return;
    }

    status.innerHTML = `
      ✅ Done! <br><br>
      <a href="${data.model.model_url}" target="_blank">
        Download Model
      </a>
    `;

  } catch (err) {
    status.innerText = "❌ Failed: " + err.message;
  }
}
</script>

</body>
</html>
