<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Cricket Smash – 3D Face Creator</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(180deg, #020617, #0b3b82);
    color: white;
}

header {
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, #020617, #1d4ed8);
}

nav a {
    margin: 0 10px;
    color: #7dd3fc;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 40px;
    text-align: center;
}

.upload-box {
    border: 2px dashed #38bdf8;
    padding: 30px;
    border-radius: 12px;
}

.btn {
    margin-top: 15px;
    padding: 12px 25px;
    border-radius: 999px;
    border: none;
    background: #38bdf8;
    cursor: pointer;
    font-weight: bold;
    position: relative;
    z-index: 10;
}

#viewer {
    width: 100%;
    height: 400px;
    background: black;
    margin-top: 30px;
    border-radius: 10px;
}

canvas {
    pointer-events: none;
}

#loading {
    display: none;
    margin-top: 15px;
    color: #38bdf8;
}
</style>
</head>

<body>

<header>
<h1>Avatar Cricket Smash</h1>
<p>Create your own 3D face</p>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="privacy.html">Privacy</a>
<a href="terms.html">Terms</a>
<a href="ind.html">India</a>
</nav>
</header>

<div class="container">

<div class="upload-box">
<input type="file" id="imageInput"><br>
<button class="btn" id="generateBtn">Generate 3D Face</button>
</div>

<div id="loading">⏳ Generating...</div>

<div id="viewer"></div>

<button class="btn" id="downloadModelBtn">Download Mesh</button>
<button class="btn" id="downloadTextureBtn">Download Texture</button>

</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js';

/* YOUR WORKER */
const BASE_URL = "https://bitter-mountain-4202.rajibyoutbe541.workers.dev";

let scene, camera, renderer;
let modelUrl = "";
let textureUrl = "";

/* WAIT FOR PAGE LOAD */
window.addEventListener("DOMContentLoaded", () => {

    const generateBtn = document.getElementById("generateBtn");
    const downloadModelBtn = document.getElementById("downloadModelBtn");
    const downloadTextureBtn = document.getElementById("downloadTextureBtn");

    function initViewer() {
        const container = document.getElementById("viewer");

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(75, container.clientWidth/container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);

        container.innerHTML = "";
        container.appendChild(renderer.domElement);

        new OrbitControls(camera, renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    }

    function loadModel(url) {
        const loader = new GLTFLoader();
        loader.load(url, (gltf) => {
            scene.clear();
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
            scene.add(gltf.scene);
        });
    }

    generateBtn.addEventListener("click", async () => {

        const file = document.getElementById("imageInput").files[0];
        if (!file) return alert("Upload image first");

        document.getElementById("loading").style.display = "block";

        const formData = new FormData();
        formData.append("image", file);

        try {
            const res = await fetch(`${BASE_URL}/generate`, {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            console.log("API:", data);

            if (!data.model_url) {
                alert("Error generating model");
                return;
            }

            modelUrl = data.model_url;
            textureUrl = data.texture_url;

            initViewer();
            loadModel(modelUrl);

        } catch (e) {
            console.error(e);
            alert("Error generating model");
        }

        document.getElementById("loading").style.display = "none";
    });

    downloadModelBtn.addEventListener("click", () => {
        if (!modelUrl) return alert("Generate first");
        window.open(modelUrl);
    });

    downloadTextureBtn.addEventListener("click", () => {
        if (!textureUrl) return alert("Generate first");
        window.open(textureUrl);
    });

});

</script>

</body>
</html>
