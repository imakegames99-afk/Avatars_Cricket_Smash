<!DOCTYPE html>
<html>
<head>
  <title>3D Model Generator</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 40px;
    }

    button {
      padding: 10px 20px;
      background: #00ffcc;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00ccaa;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<h2>Upload Image → Generate 3D Model</h2>

<input type="file" id="file" accept="image/*"><br><br>

<button onclick="generate()">Generate</button>

<div id="status"></div>

<script>
async function generate() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");

  if (!file) {
    alert("Please select an image");
    return;
  }

  status.innerText = "⏳ Uploading & generating... (20–60 sec)";

  const formData = new FormData();
  formData.append("image", file);

  try {
    const res = await fetch("https://bitter-mountain-4202.rajibyoutbe541.workers.dev/", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    console.log("FULL RESPONSE:", data);

    if (!data.success) {
      status.innerText = "❌ Error: " + JSON.stringify(data);
      return;
    }

    // ✅ SUCCESS
    status.innerHTML = `
      ✅ 3D Model Generated!<br><br>
      <a href="${data.model.model_url}" target="_blank">
        Download 3D Model
      </a>
    `;

  } catch (err) {
    status.innerText = "❌ Failed: " + err.message;
  }
}
</script>

</body>
</html>
