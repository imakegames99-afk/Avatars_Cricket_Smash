<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Cricket Smash – 3D Face Creator</title>

    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(180deg, #020617, #0b3b82);
            color: white;
            text-align: center;
        }

        header {
            padding: 40px;
        }

        #viewer {
            width: 100%;
            height: 400px;
            background: black;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            margin-top: 15px;
            border-radius: 999px;
            border: none;
            background: #38bdf8;
            cursor: pointer;
        }

        #loading {
            display: none;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>3D Face Creator</h1>
        <p>Upload → Generate → Download</p>
    </header>

    <input type="file" id="imageInput" accept="image/*"><br>
    <button class="btn" onclick="generate3D()">Generate 3D Face</button>

    <div id="loading">⏳ Generating...</div>

    <div id="viewer"></div>

    <button class="btn" onclick="downloadModel()">Download Mesh</button>
    <button class="btn" onclick="downloadTexture()">Download Texture</button>

    <script>
        const BASE_URL = "bitter-mountain-4202.rajibyoutbe541.workers.dev"; // 🔥 CHANGE THIS

        let scene, camera, renderer, controls;
        let generatedModelUrl = "";
        let generatedTextureUrl = "";

        /* INIT VIEWER */
        function initViewer() {
            const container = document.getElementById("viewer");

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);

            container.innerHTML = "";
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
            scene.add(light);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        /* LOAD MODEL */
        function loadModel(url) {
            const loader = new THREE.GLTFLoader();

            loader.load(url, function (gltf) {
                scene.clear();

                const light = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
                scene.add(light);

                scene.add(gltf.scene);

            }, undefined, function (error) {
                console.error(error);
            });
        }

        /* GENERATE */
        async function generate3D() {
            const file = document.getElementById("imageInput").files[0];

            if (!file) {
                alert("Upload image first!");
                return;
            }

            document.getElementById("loading").style.display = "block";

            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch(`${BASE_URL}/generate`, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                generatedModelUrl = data.model_url;
                generatedTextureUrl = data.texture_url;

                initViewer();
                loadModel(generatedModelUrl);

            } catch (err) {
                alert("Error generating model");
                console.error(err);
            }

            document.getElementById("loading").style.display = "none";
        }

        /* DOWNLOAD */
        function downloadModel() {
            if (!generatedModelUrl) return alert("Generate first");
            window.open(generatedModelUrl);
        }

        function downloadTexture() {
            if (!generatedTextureUrl) return alert("Generate first");
            window.open(generatedTextureUrl);
        }
    </script>

</body>
</html>
