<!DOCTYPE html>
<html>
<head>
  <title>AI 3D Generator</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px;
      background: #111;
      color: white;
    }

    .box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
    }

    button {
      padding: 10px 20px;
      margin-top: 15px;
      border: none;
      background: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover {
      background: #00ccaa;
    }

    #status {
      margin-top: 20px;
    }

    a {
      color: #00ffcc;
    }
  </style>
</head>
<body>

<h1>Generate Your 3D Model</h1>

<div class="box">
  <input type="file" id="file"><br>
  <button onclick="generate()">Generate 3D</button>

  <div id="status"></div>
</div>

<script>
async function generate() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");

  if (!file) {
    alert("Select an image first");
    return;
  }

  status.innerHTML = "⏳ Uploading & generating...";

  const formData = new FormData();
  formData.append("image", file);

  try {
    const res = await fetch("https://YOUR-WORKER-URL.workers.dev", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!data.success) {
      status.innerHTML = "❌ Error: " + JSON.stringify(data);
      return;
    }

    status.innerHTML = `
      ✅ Model Ready!<br><br>
      <a href="${data.model.model_url}" target="_blank">
        Download 3D Model
      </a>
    `;

  } catch (err) {
    status.innerHTML = "❌ Failed: " + err.message;
  }
}
</script>

</body>
</html>
