<!DOCTYPE html>
<html>
<body style="background:#111;color:white;text-align:center;padding:40px">

<h2>Upload Image → 3D Model</h2>

<input type="file" id="file" accept="image/*"><br><br>
<button onclick="generate()">Generate</button>

<p id="status"></p>

<model-viewer id="viewer"
  style="width:300px;height:300px;display:none;"
  camera-controls auto-rotate>
</model-viewer>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<script>
async function generate() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");
  const viewer = document.getElementById("viewer");

  if (!file) {
    alert("Select image");
    return;
  }

  status.innerText = "⏳ Generating... (20–60 sec)";
  viewer.style.display = "none";

  const formData = new FormData();
  formData.append("image", file);

  try {
    const res = await fetch("https://bitter-mountain-4202.rajibyoutbe541.workers.dev", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!data.success) {
      status.innerText = "❌ " + JSON.stringify(data);
      return;
    }

    const modelUrl = data.model.model_url;

    status.innerHTML = `
      ✅ Model Ready<br><br>
      <a href="${modelUrl}" target="_blank">Download</a>
    `;

    viewer.src = modelUrl;
    viewer.style.display = "block";

  } catch (err) {
    status.innerText = "❌ Error: " + err.message;
  }
}
</script>

</body>
</html>
