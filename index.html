<!DOCTYPE html>
<html>
<body>

<h2>Generate 3D Model</h2>

<input type="file" id="file"><br><br>
<button onclick="generate()">Generate</button>

<p id="status"></p>

<script>
async function generate() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");

  if (!file) {
    alert("Select image");
    return;
  }

  status.innerText = "⏳ Generating...";

  const formData = new FormData();
  formData.append("image", file);

  try {
    const res = await fetch("https://bitter-mountain-4202.rajibyoutbe541.workers.dev/", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!data.success) {
      status.innerText = "❌ Error: " + JSON.stringify(data);
      return;
    }

    status.innerHTML = `
      ✅ Done! <br><br>
      <a href="${data.model.model_url}" target="_blank">
        Download Model
      </a>
    `;

  } catch (err) {
    status.innerText = "❌ Failed: " + err.message;
  }
}
</script>

</body>
</html>
