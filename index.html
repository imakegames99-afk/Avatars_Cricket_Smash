<!DOCTYPE html>
<html>
<head>
  <title>Cloudflare → Tripo 3D</title>
</head>
<body>

<h2>Upload Image → Generate 3D</h2>

<input type="file" id="fileInput">
<button onclick="uploadAndGenerate()">Upload & Generate</button>

<pre id="output"></pre>

<script>
const CLOUDFLARE_ACCOUNT_ID = "YOUR_ACCOUNT_ID";
const CLOUDFLARE_UPLOAD_TOKEN = "YOUR_UNSIGNED_UPLOAD_TOKEN";
const TRIPO_API_KEY = "YOUR_TRIPO_API_KEY";

async function uploadAndGenerate() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("Select an image");

  // STEP 1: Upload to Cloudflare
  const formData = new FormData();
  formData.append("file", file);

  const uploadRes = await fetch(
    `https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/images/v1`,
    {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + CLOUDFLARE_UPLOAD_TOKEN
      },
      body: formData
    }
  );

  const uploadData = await uploadRes.json();
  console.log("Upload:", uploadData);

  if (!uploadData.success) {
    document.getElementById("output").innerText = "Upload failed";
    return;
  }

  // Get public URL
  const imageUrl = uploadData.result.variants[0];
  console.log("Image URL:", imageUrl);

  // STEP 2: Send to Tripo
  const taskRes = await fetch("https://api.tripo3d.ai/v2/openapi/task", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + TRIPO_API_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      type: "image_to_model",
      input: {
        image_url: imageUrl
      }
    })
  });

  const taskData = await taskRes.json();
  document.getElementById("output").innerText = JSON.stringify(taskData, null, 2);

  const taskId = taskData?.data?.task_id;
  if (taskId) checkStatus(taskId);
}

// STEP 3: Poll Tripo
async function checkStatus(taskId) {
  const interval = setInterval(async () => {
    const res = await fetch(`https://api.tripo3d.ai/v2/openapi/task/${taskId}`, {
      headers: {
        "Authorization": "Bearer " + TRIPO_API_KEY
      }
    });

    const data = await res.json();
    document.getElementById("output").innerText = JSON.stringify(data, null, 2);

    if (data.data.status === "success") {
      clearInterval(interval);
      alert("✅ 3D Model Ready!");
      console.log("MODEL:", data.data.output);
    }

    if (data.data.status === "failed") {
      clearInterval(interval);
      alert("❌ Failed");
    }

  }, 5000);
}
</script>

</body>
</html>
